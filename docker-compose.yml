# Levanta el sistema con datos de demostración en http://localhost:8540
services:
  web:
    build: .
    image: inventario-activos
    ports:
      - "8540:8000"
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: cambiar-esta-clave-en-produccion
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,host.docker.internal
      URL_PUBLICA: http://localhost:8540
      APP_DEMO: "true"
      DB_HOST: db
      DB_NAME: activos
      DB_USER: activos
      DB_PASSWORD: activos_demo
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: activos
      MARIADB_USER: activos
      MARIADB_PASSWORD: activos_demo
      MARIADB_ROOT_PASSWORD: root_demo
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

volumes:
  db:
